name: Build tmux
description: Restore or build a validated tmux with the shared libtmux/.github action, which this wrapper pins once for every job.

inputs:
  ref:
    description: A tmux release, tag, branch or 40-hex commit.
    required: true

outputs:
  prefix:
    description: The directory tmux is installed under; its bin/ holds tmux.
    value: ${{ steps.tmux.outputs.prefix }}

runs:
  using: composite
  steps:
    - name: Build tmux ${{ inputs.ref }}
      id: tmux
      uses: libtmux/.github/actions/build-tmux@b8713f1e820c337d3b0562c4809dd0a11eecb5d3
      with:
        ref: ${{ inputs.ref }}
