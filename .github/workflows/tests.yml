name: tests

# A branch with an open pull request would otherwise run this twice per push,
# once for each event, and the two runs compete for the same runners while
# driving real tmux servers. That contention is what makes the timing-sensitive
# tests fail on one of the pair and pass on the other.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A superseded push should not keep a matrix this wide running to completion:
# nothing reads the result once a newer commit exists on the same pull request.
# Cancelling is scoped to pull requests so a master push is never interrupted,
# and the SHA in the group key keeps consecutive master pushes in groups of
# their own rather than queued behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job below names its modules one at a time. `go test ./...` stops at a
# module boundary, so the consumer modules and the benchmarks are invisible to
# the core module's wildcard and would rot unchecked. Go also skips a directory
# whose name begins with an underscore, which is why `examples` is named too.
env:
  # A tmux namespace of this repository's own. Sibling checkouts run their own
  # suites on the same machine, and a shared socket directory is one suite
  # ending servers another is still using.
  TMUX_TMPDIR: /tmp/libtmux-go-ci

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [".", "examples", "workspace", "mcp", "benchmarks", "internal/tools"]
        go-version: ["1.26", "1.27"]
    steps:
      # Whole history, because the gates on staleness compare what is written
      # down against the tags -- the version a source build reports, and the
      # version every go.mod requires -- and a checkout without tags skips them
      # rather than failing. fetch-tags alone does not do it: it drops --no-tags
      # from a depth-1 fetch, and no tag points at the one commit that fetches,
      # so none arrive.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux

      - name: Create the tmux socket directory
        run: mkdir -p "$TMUX_TMPDIR"

      # Coverage names the core module explicitly rather than defaulting to the
      # package under test. The tests that exercise the core live in
      # internal/integration, so counting only the package under test would
      # report the core as uncovered by the tests that cover it.
      #
      # The workspace stays on. GOWORK=off answers whether a module resolves
      # for a stranger, which is a real question answered by the standalone
      # module-metadata test. It cannot also answer whether this tree works,
      # because mcp carries no replace
      # directive and so resolves the core from the proxy. Asking one run both
      # questions is how nineteen commits of core reached the mcp job as a
      # release nobody had built against it.
      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        env:
          # The floor is only tested if the go command cannot leave it. Left to
          # its default, a go.mod requiring more than the matrix version makes
          # the go command fetch that newer toolchain and pass, so the oldest
          # entry would prove nothing.
          GOTOOLCHAIN: local
        run: |
          tmux -V
          go vet ./...
          "$GITHUB_WORKSPACE/scripts/test-module.sh" "${{ matrix.module }}" -race -count=1 -coverpkg=./... -coverprofile=coverage.out

      # An artifact name cannot contain a path separator, and one module is
      # nested, so the separator becomes a dash.
      - name: Name the coverage artifact
        id: coverage
        env:
          MODULE: ${{ matrix.module }}
        run: echo "name=coverage-${MODULE//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.coverage.outputs.name }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: ignore

  # Generated output is checked in, so the check is that regenerating it changes
  # nothing. The Go in the README is generated from the examples, which is what
  # stops a snippet drifting from the program it was copied from.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.mod
            mcp/go.mod

      - name: Regenerate
        run: |
          go generate ./...
          go -C mcp generate ./...

      - name: Report anything regenerating changed
        run: |
          if ! git diff --exit-code; then
            echo "::error::generated files are out of date; run both module generators" >&2
            exit 1
          fi

  # An exported identifier can change or vanish without anything saying so: the
  # changelog is written by hand, and nothing compares what a release exports
  # against what the last one did. This reports that difference into the run
  # summary rather than failing on it, because an alpha module breaks its API
  # on purpose and a gate that forbids it would be turned off.
  api-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Whole history: the comparison needs the tag the last release carries.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.mod
            workspace/go.mod
            mcp/go.mod

      - name: Report the exported API difference since each module's last tag
        env:
          GORELEASE: golang.org/x/exp/cmd/gorelease@v0.0.0-20250620022241-b7579e27df2b
        run: |
          set -u
          status=0
          for module in . workspace mcp; do
            case $module in
              .) prefix='v' ;;
              *) prefix="$module/v" ;;
            esac
            tag=$(git tag --list "$prefix*" | sort -V | tail -1)
            # A nested module is tagged with its directory, and carries the
            # bare semantic version that tag encodes.
            base=${tag#"$module/"}
            if [ -z "$tag" ]; then
              printf '### %s\n\nNo tag to compare against.\n\n' "$module" \
                >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            printf '### %s since %s\n\n```\n' "$module" "$tag" \
              >> "$GITHUB_STEP_SUMMARY"
            (cd "$module" && go run "$GORELEASE" -base "$base" 2>&1) \
              >> "$GITHUB_STEP_SUMMARY" || status=$?
            printf '```\n\n' >> "$GITHUB_STEP_SUMMARY"
          done
          printf 'gorelease reported status %s; this job does not fail on it.\n' \
            "$status"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [".", "examples", "workspace", "mcp", "benchmarks", "internal/tools"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.27.2'
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Check formatting
        working-directory: ${{ matrix.module }}
        run: |
          if ! output=$(go run mvdan.cc/gofumpt@v0.12.0 -l .); then
            echo "gofumpt failed" >&2
            exit 1
          fi
          if [ -n "$output" ]; then
            echo "these files are not gofumpt-formatted:" >&2
            echo "$output" >&2
            exit 1
          fi

      # verify is off here and run explicitly below. Each module has its own
      # configuration, including module-specific directive policy, so each one
      # must be checked from the directory where lint selects it.
      # The linter must understand the toolchain's compiler export data.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
          verify: false

      # Worth keeping despite the network: golangci-lint run ignores a
      # configuration key it does not recognise and reports no issues, so a
      # misspelled linter setting silently does nothing without this.
      - name: Verify the lint configuration
        working-directory: ${{ matrix.module }}
        run: golangci-lint config verify

      - name: Report known vulnerabilities
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # tmux itself does not run on Windows, but constructor-time executable
  # resolution follows Windows PATH, PATHEXT, and current-directory rules.
  # Cross-compilation cannot exercise those filesystem semantics. This is
  # also the only job that compiles workspace/internal/cli's "!unix" files:
  # every other job runs on Linux, where "unix" wins instead.
  windows-resolver:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.mod
            workspace/go.mod

      - name: Test Windows executable resolution
        run: |
          go vet ./tmux/internal/tmuxcmd
          go test -count=1 -run '^TestResolveExecutable' ./tmux/internal/tmuxcmd

      - name: Vet the workspace module on Windows
        run: go -C workspace vet ./...

  # The fuzz targets already carry regression seeds. A bounded job lets the
  # engine keep searching without turning an open-ended fuzz run into a gate
  # that never completes.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      # go test exits zero with only a warning when -fuzz matches no target.
      # Check the names first so a rename cannot silently disable this job.
      - name: Verify fuzz targets
        run: |
          test "$(go test ./tmux -list '^FuzzDecodeArgsEscapedValueRoundTrip$' | sed -n '1p')" = 'FuzzDecodeArgsEscapedValueRoundTrip'
          test "$(go test ./tmux -list '^FuzzDecodeFormatRecordsRoundTrip$' | sed -n '1p')" = 'FuzzDecodeFormatRecordsRoundTrip'

      - name: Fuzz escaped option values
        run: go test ./tmux -run '^$' -fuzz '^FuzzDecodeArgsEscapedValueRoundTrip$' -fuzztime 30s

      - name: Fuzz format records
        run: go test ./tmux -run '^$' -fuzz '^FuzzDecodeFormatRecordsRoundTrip$' -fuzztime 30s

  # The benchmarks module prints the table BENCHMARKS.md holds. Publishing it
  # here is what lets the checked-in numbers be compared against a run other
  # than the one they were recorded on.
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: benchmarks/go.mod

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux

      - name: Publish the switch matrix
        continue-on-error: true
        working-directory: benchmarks
        run: |
          mkdir -p "$TMUX_TMPDIR"
          {
            echo '### Switch matrix'
            echo
            echo '```'
            go run .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The supported tmux range is a claim the README makes, so something has to
  # check it. Ubuntu ships one tmux; version-specific breakage is why this
  # exists -- 3.4 stopped taking split-window's -p that 3.3a and 3.5 both take.
  #
  # This module carries code that only runs on tmux 3.8 and later - JSON
  # layouts, twelve format fields, a popup guard, session-scoped subscriptions
  # - so the list ends with the 3.8-rc2 candidate, the final 3.8 and tmux
  # master. The version check ranks a candidate below its release, so 3.8-rc2 is
  # checked as the build that precedes 3.8, not as 3.8. Master reports
  # "next-X.Y"; it moves, so its lane is advisory. It runs every module's full
  # suite and is expected to pass: a red master lane means upstream changed
  # something this library has not followed yet, to fix in its own change, and
  # it never blocks the one under review. The only tests that skip on master
  # are the popup tests that need a client overlay, which tmux replaced with a
  # floating pane.
  tmux-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.tmux-version == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        tmux-version: ['3.3a', '3.4', '3.5', '3.6', '3.7', '3.7a', '3.7b', '3.7c', '3.8-rc2', '3.8', 'master']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      - name: Cache the tmux build for ${{ matrix.tmux-version }}
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: ~/tmux-builds/tmux-${{ matrix.tmux-version }}
          key: tmux-${{ matrix.tmux-version }}${{ matrix.tmux-version == 'master' && format('-{0}', github.run_id) || '' }}

      - name: Build tmux ${{ matrix.tmux-version }}
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        env:
          TMUX_VERSION: ${{ matrix.tmux-version }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes libevent-dev libncurses5-dev libtinfo-dev \
            libutempter-dev bison autoconf automake pkg-config
          git clone --depth 1 --branch "$TMUX_VERSION" \
            https://github.com/tmux/tmux.git ~/tmux-src
          cd ~/tmux-src
          sh autogen.sh
          ./configure --prefix="$HOME/tmux-builds/tmux-$TMUX_VERSION"
          make && make install

      - name: Test compatible module coverage against tmux ${{ matrix.tmux-version }}
        env:
          TMUX_VERSION: ${{ matrix.tmux-version }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes libevent-2.1-7
          export PATH="$HOME/tmux-builds/tmux-$TMUX_VERSION/bin:$PATH"
          actual_version=$(tmux -V)
          expected_version="tmux $TMUX_VERSION"
          if [ "$TMUX_VERSION" = master ]; then
            case "$actual_version" in
              "tmux next-"*) ;;
              *) echo "::error::expected a next-X.Y master build, got $actual_version" >&2; exit 1 ;;
            esac
          elif [ "$actual_version" != "$expected_version" ]; then
            echo "::error::expected $expected_version, got $actual_version" >&2
            exit 1
          fi
          printf '%s\n' "$actual_version"
          mkdir -p "$TMUX_TMPDIR"
          for module in . examples workspace mcp benchmarks internal/tools; do
            echo "--- $module: full suite ---"
            ./scripts/test-module.sh "$module" -count=1
          done

      # Tests that put a 3.3a daemon beside this lane's newer client skip
      # without a 3.3a build, and a lane that skips them proves nothing. Lanes
      # from 3.7 up have the control client those tests start, so they build
      # 3.3a, name it, and fail if any of the tests does not run and pass.
      - name: Cache the tmux 3.3a build for the older-daemon tests
        id: older-cache
        if: contains(fromJSON('["3.7", "3.7a", "3.7b", "3.7c", "3.8-rc2", "3.8", "master"]'), matrix.tmux-version)
        uses: actions/cache@v6
        with:
          path: ~/tmux-builds/tmux-3.3a
          key: tmux-3.3a

      - name: Build tmux 3.3a for the older-daemon tests
        if: steps.older-cache.outcome == 'success' && steps.older-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libevent-dev libncurses5-dev libtinfo-dev \
            libutempter-dev bison autoconf automake pkg-config
          git clone --depth 1 --branch 3.3a \
            https://github.com/tmux/tmux.git ~/tmux-src-3.3a
          cd ~/tmux-src-3.3a
          sh autogen.sh
          ./configure --prefix="$HOME/tmux-builds/tmux-3.3a"
          make && make install

      - name: Run the older-daemon tests against tmux ${{ matrix.tmux-version }}
        if: steps.older-cache.outcome == 'success'
        env:
          TMUX_VERSION: ${{ matrix.tmux-version }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes libevent-2.1-7
          export PATH="$HOME/tmux-builds/tmux-$TMUX_VERSION/bin:$PATH"
          export LIBTMUX_OPTIONAL_OLD_TMUX="$HOME/tmux-builds/tmux-3.3a/bin/tmux"
          test "$("$LIBTMUX_OPTIONAL_OLD_TMUX" -V)" = 'tmux 3.3a'
          mkdir -p "$TMUX_TMPDIR"
          set -o pipefail
          run_required() {
            module=$1; shift
            regex="^($(printf '%s|' "$@" | sed 's/|$//'))\$"
            ./scripts/test-module.sh "$module" -count=1 -v -run "$regex" | tee "$RUNNER_TEMP/older.log"
            for name in "$@"; do
              grep -q -- "^--- PASS: $name " "$RUNNER_TEMP/older.log" || { echo "::error::$name did not run and pass"; exit 1; }
            done
          }
          run_required . \
            TestOptionalControlRejectsOlderSupportedDaemon \
            TestOptionalColdControlRejectsOlderExecutable \
            TestOptionalColdBootstrapKeepsItsFeatureFloor \
            TestPinnedControlSocketPreventsReplacement \
            TestOptionalRefusalsLeaveOlderCoreStateIntact \
            TestStartControlModeRefusesOlderSupportedDaemon
          run_required workspace TestWorkspaceChoosesAnEligibleTransport
          run_required mcp \
            TestOlderCoreRuntimeKeepsItsProcessLane \
            TestOlderCoreRuntimeBootstrapsWithoutControl \
            TestOlderPasteStagingRefusesBeforeTheFirstChunk \
            TestOlderWaitForTextPollsInsteadOfRefusing

  tmux-rejected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rejected-version: ['3.0a', '3.1c', '3.2a', '3.3']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: Install tmux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libevent-dev libncurses5-dev libtinfo-dev \
            libutempter-dev bison autoconf automake pkg-config
      - name: Cache supported and rejected tmux fixtures
        id: version-cache
        uses: actions/cache@v6
        with:
          path: ~/tmux-version-builds
          key: tmux-version-3.3a-3.7c-${{ matrix.rejected-version }}
      - name: Build version-check fixtures
        if: steps.version-cache.outputs.cache-hit != 'true'
        env:
          REJECTED_VERSION: ${{ matrix.rejected-version }}
        run: |
          # The unpatched 3.3 lane also builds 3.7c, the newer client the
          # stale-executable test needs beside the 3.3a floor build.
          releases="3.3a $REJECTED_VERSION"
          if [ "$REJECTED_VERSION" = 3.3 ]; then releases="$releases 3.7c"; fi
          for release in $releases; do
            git clone --depth 1 --branch "$release" \
              https://github.com/tmux/tmux.git "$RUNNER_TEMP/tmux-$release"
            (
              cd "$RUNNER_TEMP/tmux-$release"
              sh autogen.sh
              ./configure --prefix="$HOME/tmux-version-builds/$release"
              make -j2 && make install
            )
          done
      - name: Refuse unsupported daemons before effects
        env:
          REJECTED_VERSION: ${{ matrix.rejected-version }}
        run: |
          export PATH="$HOME/tmux-version-builds/3.3a/bin:$PATH"
          export LIBTMUX_REJECTED_TMUX="$HOME/tmux-version-builds/$REJECTED_VERSION/bin/tmux"
          export LIBTMUX_FLOOR_TMUX="$HOME/tmux-version-builds/3.3a/bin/tmux"
          test "$(tmux -V)" = 'tmux 3.3a'
          test "$("$LIBTMUX_REJECTED_TMUX" -V)" = "tmux $REJECTED_VERSION"
          mkdir -p "$TMUX_TMPDIR"
          # A skipped test or a filter that matches nothing must fail this job.
          export LIBTMUX_REQUIRE_REJECTED=1
          required='TestCoreMinimumRejectsExplicitOlderDaemon TestCoreMinimumOpaqueExecutableOn33a'
          case "$REJECTED_VERSION" in
            3.0a|3.1c)
              export LIBTMUX_REQUIRE_PRE32=1
              required="$required TestCoreMinimumRefusesDaemonBeforeProbeExisted TestCoreMinimumRefusesExecutableBeforeProbeExisted TestCoreMinimumRefusesPre32DaemonPromptly"
              ;;
          esac
          set -o pipefail
          go test -count=1 -timeout 2m -v ./tmux/internal/integration -run '^TestCoreMinimum' | tee "$RUNNER_TEMP/rejected.log"
          for name in $required; do
            grep -q -- "^--- PASS: $name " "$RUNNER_TEMP/rejected.log" || { echo "::error::$name did not run and pass"; exit 1; }
          done
          if [ "$REJECTED_VERSION" = 3.3 ]; then
            # A configured 3.7c executable replaced by the 3.3a floor build must
            # be checked afresh, which needs both on hand.
            name=TestCoreMinimumColdFeatureRequirementUsesFreshExecutable
            PATH="$HOME/tmux-version-builds/3.7c/bin:$PATH" go test -count=1 -timeout 2m -v ./tmux/internal/integration -run "^$name\$" | tee "$RUNNER_TEMP/cold.log"
            grep -q -- "^--- PASS: $name " "$RUNNER_TEMP/cold.log" || { echo "::error::$name did not run and pass"; exit 1; }
          fi
