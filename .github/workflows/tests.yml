name: tests

# A branch with an open pull request would otherwise run this twice per push,
# once for each event, and the two runs compete for the same runners while
# driving real tmux servers. That contention is what makes the timing-sensitive
# tests fail on one of the pair and pass on the other.
on:
  push:
    branches: [master]
  pull_request:

# Every job below names its modules one at a time. `go test ./...` stops at a
# module boundary, so the consumer modules and the benchmarks are invisible to
# the core module's wildcard and would rot unchecked. Go also skips a directory
# whose name begins with an underscore, which is why `examples` is named too.
env:
  # A tmux namespace of this repository's own. Sibling checkouts run their own
  # suites on the same machine, and a shared socket directory is one suite
  # ending servers another is still using.
  TMUX_TMPDIR: /tmp/libtmux-go-ci

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "examples", "workspace", "mcp", "benchmarks"]
        go-version: ["1.26", "1.27"]
    steps:
      # Whole history, because the gates on staleness compare what is written
      # down against the tags -- the version a source build reports, and the
      # version every go.mod requires -- and a checkout without tags skips them
      # rather than failing. fetch-tags alone does not do it: it drops --no-tags
      # from a depth-1 fetch, and no tag points at the one commit that fetches,
      # so none arrive.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux

      - name: Create the tmux socket directory
        run: mkdir -p "$TMUX_TMPDIR"

      # Coverage names the core module explicitly rather than defaulting to the
      # package under test. The tests that exercise the core live in
      # internal/integration, so counting only the package under test would
      # report the core as uncovered by the tests that cover it.
      #
      # The workspace stays on. GOWORK=off answers whether a module resolves
      # for a stranger, which is a real question and is why
      # TestEveryModuleResolvesWithoutAWorkspace asks it -- but it cannot also
      # answer whether this tree works, because mcp carries no replace
      # directive and so resolves the core from the proxy. Asking one run both
      # questions is how nineteen commits of core reached the mcp job as a
      # release nobody had built against it.
      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        env:
          # The floor is only tested if the go command cannot leave it. Left to
          # its default, a go.mod requiring more than the matrix version makes
          # the go command fetch that newer toolchain and pass, so the oldest
          # entry would prove nothing.
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: ignore

  # Generated output is checked in, so the check is that regenerating it changes
  # nothing. The Go in the README is generated from the examples, which is what
  # stops a snippet drifting from the program it was copied from.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      - name: Regenerate
        run: go generate ./...

      - name: Report anything regenerating changed
        run: |
          if ! git diff --exit-code; then
            echo "::error::generated files are out of date; run 'go generate ./...'" >&2
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "examples", "workspace", "mcp", "benchmarks"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Check formatting
        working-directory: ${{ matrix.module }}
        run: |
          if ! output=$(go run mvdan.cc/gofumpt@v0.9.2 -l .); then
            echo "gofumpt failed" >&2
            exit 1
          fi
          if [ -n "$output" ]; then
            echo "these files are not gofumpt-formatted:" >&2
            echo "$output" >&2
            exit 1
          fi

      # verify is off here and run once below. It fetches a JSON schema over
      # the network, and every module in this matrix shares the one
      # .golangci.yml at the root, so leaving it on checks the same file five
      # times and takes five chances that golangci-lint.run is slow. It has
      # already spent one of them.
      # Must be built with a Go at least as new as the one set up above:
      # golangci-lint typechecks against the toolchain's own export data.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: ${{ matrix.module }}
          verify: false

      # Worth keeping despite the network: golangci-lint run ignores a
      # configuration key it does not recognise and reports no issues, so a
      # misspelled linter setting silently does nothing without this.
      - name: Verify the lint configuration
        if: matrix.module == '.'
        run: golangci-lint config verify

      - name: Report known vulnerabilities
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # The benchmarks module prints the table BENCHMARKS.md holds. Publishing it
  # here is what lets the checked-in numbers be compared against a run other
  # than the one they were recorded on.
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: benchmarks/go.mod

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux

      - name: Publish the switch matrix
        continue-on-error: true
        working-directory: benchmarks
        run: |
          mkdir -p "$TMUX_TMPDIR"
          {
            echo '### Switch matrix'
            echo
            echo '```'
            go run .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The supported tmux range is a claim the README makes, so something has to
  # check it. Ubuntu ships one tmux; version-specific breakage is why this
  # exists -- 3.4 stopped taking split-window's -p that 3.3a and 3.5 both take,
  # and pane_start_path does not exist before 3.3.
  tmux-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tmux-version: ['3.2a', '3.3a', '3.4', '3.5', '3.6', '3.7', '3.7a', '3.7b']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      - name: Cache the tmux build for ${{ matrix.tmux-version }}
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: ~/tmux-builds/tmux-${{ matrix.tmux-version }}
          key: tmux-${{ matrix.tmux-version }}

      - name: Build tmux ${{ matrix.tmux-version }}
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        env:
          TMUX_VERSION: ${{ matrix.tmux-version }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes libevent-dev libncurses5-dev libtinfo-dev \
            libutempter-dev bison autoconf automake pkg-config
          git clone --depth 1 --branch "$TMUX_VERSION" \
            https://github.com/tmux/tmux.git ~/tmux-src
          cd ~/tmux-src
          sh autogen.sh
          ./configure --prefix="$HOME/tmux-builds/tmux-$TMUX_VERSION"
          make && make install

      - name: Test every module against tmux ${{ matrix.tmux-version }}
        env:
          TMUX_VERSION: ${{ matrix.tmux-version }}
        run: |
          sudo apt-get install --yes libevent-2.1-7
          export PATH="$HOME/tmux-builds/tmux-$TMUX_VERSION/bin:$PATH"
          tmux -V
          mkdir -p "$TMUX_TMPDIR"
          for module in . examples workspace mcp benchmarks; do
            echo "--- $module ---"
            (cd "$module" && go test -count=1 ./...)
          done
