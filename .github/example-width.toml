width = 80
tab_width = 4
shared_digest = "28b74bae1f7a06731fea5a150cbde4430179b7788b7564ea1644c3951df8531b"
checker_digest = "eb87afceb3fc8f11ef5a478cd38f901ef3950e89ff94fbe0ca281c0cfc1a0e2e"
allow_ceiling = 4
markdown = ["**/*.md"]
sources = [
  "**/examples/**/*.go",
  "**/example_test.go",
  "**/*_example_test.go",
  "**/examples/go.mod",
  "**/examples/.golangci.yml",
]
doc_comments = ["**/*.go"]

[[exclude]]
glob = "examples/LICENSE"
reason = "license text; nobody reads it for code"

[[allow]]
path = "examples/byte-streams/main.go"
line = "\t// docs:byte-streams given:ctx context.Context; server tmux.Server; pane tmux.Pane; payload *strings.Reader; archive string; marker string"
reason = "docs marker line; the generator reads it whole"

[[allow]]
path = "examples/control-mode-subscribe/main.go"
line = "\t// docs:subscribing given:ctx context.Context; session tmux.Session; stream *tmux.NotificationStream"
reason = "docs marker line; the generator reads it whole"

[[allow]]
path = "tmux/example_test.go"
line = "\t// Output: {\"id\":\"\",\"sessionId\":\"\",\"windowId\":\"\",\"windowIndex\":0,\"index\":0,\"formats\":{}}"
reason = "output the test compares"

[[allow]]
path = ".github/WRITING.md"
line = "\tif _, err := connectedPane.Capture(ctx, tmux.CapturePaneRequest{}); !errors.Is("
reason = "the Bad example in the port block; it shows the width problem the Good example fixes"
