# Tooling for the maintainer scripts under scripts/. The Go modules have no
# Python dependency and do not build or install this project.
[project]
name = "libtmux-go-scripts"
version = "0.0.0"
description = "Format, lint, type and test configuration for scripts/"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
  "ty>=0.0.101",
]

[tool.uv]
package = false
# Lock only releases at least three days old. Project settings override a
# contributor's own uv configuration, so `uv lock --project scripts --check`
# gives the same answer on every machine. A relative value needs uv 0.9.17 or
# newer.
exclude-newer = "3 days"

[tool.pytest.ini_options]
# Each script is a plain module in its own directory, so tests import it by
# directory. Stand-in executables under tests/ share names across scripts and
# hold no doctests; importlib mode cannot be used here because rootdir scripts/
# would shadow matrix/matrix.py with a namespace package for matrix/.
pythonpath = [
  "api-diff",
  "ci-plan",
  "drive-mcp",
  "fuzz-targets",
  "lane-tests",
  "lib",
  "matrix",
  "test-module",
]
testpaths = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "--doctest-modules",
  "--ignore-glob=**/fake_*.py",
  "--strict-config",
  "--strict-markers",
  "-p",
  "no:cacheprovider",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "api-diff",
  "ci-plan",
  "drive-mcp",
  "fuzz-targets",
  "lane-tests",
  "lib",
  "matrix",
  "test-module",
]

[tool.ruff.lint]
extend-select = ["ANN", "B", "C4", "I", "PT", "PTH", "RUF", "SIM", "UP"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = [
  "api-diff",
  "ci-plan",
  "drive-mcp",
  "fuzz-targets",
  "lane-tests",
  "lib",
  "matrix",
  "test-module",
]
