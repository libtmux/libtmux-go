version: "2"

run:
  go: "1.26"
  modules-download-mode: readonly
  timeout: 5m

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - copyloopvar
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - gomoddirectives
    - goprintffuncname
    - intrange
    - iotamixing
    - makezero
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - nolintlint
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
    recvcheck:
      exclusions:
        - CommandAliases.set
        - TerminalFeatures.set
        - TerminalOverrides.ensureTerminal
        - TerminalOverrides.set
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocritic
        text: "dupArg:"

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
